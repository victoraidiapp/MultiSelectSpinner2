apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    compileSdkVersion 33
    buildToolsVersion '30.0.3'

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 33
        versionCode 2
        versionName '1.0.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.github.rey5137:material:1.2.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.6.1'
}

publishing {
    publications {
        release(MavenPublication) {
            afterEvaluate {
                from components.findByName("release") ?: components.findByName("default")
            }
            groupId = 'com.github.victoraidiapp' // Reemplaza con tu usuario real
            artifactId = 'MultiSelectSpinner2'
            version = '1.0.4'
        }
    }
}
